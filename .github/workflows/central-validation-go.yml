name: Central Validation

on:
  push:
    branches-ignore:
      - main
      - develop
    paths:
      # Legacy Go validation is kept for repositories with Go project files.
      - "go.mod"
      - "go.sum"
      - "**/*.go"

jobs:
  detect_go_project:
    name: Detect Go project
    runs-on: ubuntu-latest
    outputs:
      has_go_mod: ${{ steps.detect.outputs.has_go_mod }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect go.mod
        id: detect
        run: |
          if [ -f go.mod ]; then
            echo "has_go_mod=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go_mod=false" >> "$GITHUB_OUTPUT"
          fi

  verificar_version:
    name: Control de Versiones
    needs: [detect_go_project]
    if: ${{ needs.detect_go_project.outputs.has_go_mod == 'true' }}
    uses: fvalenzuela-dev/.github/.github/workflows/version-check-new.yml@main
    with:
      version_file: "VERSION"
      base_branch: "main"
    secrets:
      GITHUB_TOKEN_CUSTOM: ${{ secrets.GITHUB_TOKEN }}
  build_and_test:
    name: Build & Test
    needs: [detect_go_project]
    if: ${{ needs.detect_go_project.outputs.has_go_mod == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Convert coverage to lcov
        run: |
          go install github.com/jandelgado/gcov2lcov@latest
          mkdir -p coverage
          gcov2lcov -infile=coverage.out -outfile=coverage/lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 1

  codacy_coverage:
    name: Codacy Coverage
    needs: [detect_go_project, build_and_test]
    if: ${{ needs.detect_go_project.outputs.has_go_mod == 'true' }}
    runs-on: ubuntu-latest
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Upload coverage to Codacy
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/lcov.info

      - name: Skip Codacy upload when token is missing
        if: env.CODACY_PROJECT_TOKEN == ''
        run: |
          echo "CODACY_PROJECT_TOKEN is not configured; coverage artifact was uploaded for inspection."
