name: Central Validation

on:
  push:
    branches-ignore:
      - main
      - develop

jobs:
  verificar_version:
    name: Control de Versiones
    uses: fvalenzuela-dev/.github/.github/workflows/version-check-new.yml@main
    with:
      version_file: "VERSION"
      base_branch: "main"
    secrets:
      GITHUB_TOKEN_CUSTOM: ${{ secrets.GITHUB_TOKEN }}
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        run: coverage run -m pytest

      - name: Generate lcov coverage report
        run: |
          mkdir -p coverage
          coverage lcov -o coverage/lcov.info

      - name: Run Ruff lint check
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Run mypy
        run: mypy

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 1

  codacy_coverage:
    name: Codacy Coverage
    needs: [build_and_test]
    runs-on: ubuntu-latest
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Upload coverage to Codacy
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/lcov.info

      - name: Skip Codacy upload when token is missing
        if: env.CODACY_PROJECT_TOKEN == ''
        run: |
          echo "CODACY_PROJECT_TOKEN is not configured; coverage artifact was uploaded for inspection."
