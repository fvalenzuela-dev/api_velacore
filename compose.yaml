services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-velacore:local
    env_file:
      - path: example.env
      - path: .env
        required: false
    ports:
      - "${HOST_PORT:-8091}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ.get(\"PORT\", \"8000\")}/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
